[project]
name = "maibot-reply-integrity"
version = "1.3.0"
description = "Preserve Planner facts and separate Replier style through official MaiBot hooks."
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.20.0,<3"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
